# Hot reload for local development (docker compose `api` service, dev stage).
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api ./cmd/api"
entrypoint = ["./tmp/api"]
include_ext = ["go", "yaml"]
exclude_dir = ["tmp", "bin", "deploy", ".git", ".github"]
exclude_regex = ["_test\\.go$"]
delay = 300
stop_on_error = true
send_interrupt = true
kill_delay = 5000000000

[log]
time = false

[misc]
clean_on_exit = true
