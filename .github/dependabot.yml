# Weekly grouped updates, one PR per ecosystem, targeting develop.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      gomod:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-compose:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
