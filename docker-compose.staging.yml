# Homologation override: production-like image, no hot reload, no debug tools,
# databases unreachable from the host. TLS terminates at the monthra-infra proxy.
#   docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d
services:
  api:
    build:
      target: runtime
      args:
        VERSION: ${IMAGE_TAG:-staging-local}
    image: ghcr.io/nickealves/monthra-server:${IMAGE_TAG:-staging-local}
    environment:
      APP_ENV: staging
      LOG_LEVEL: info
      # Staging requires https origins; .env holds the local http ones.
      CORS_ALLOWED_ORIGINS: ${STAGING_CORS_ALLOWED_ORIGINS:-https://localhost}
      APP_PUBLIC_URL: ${STAGING_APP_PUBLIC_URL:-https://localhost}
      # Until the email provider is chosen (with the cloud), the local
      # homologation stack sends to Mailpit. A real staging deployment sets
      # its SMTP relay through Terraform and never SMTP_ALLOW_INSECURE.
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: none
      SMTP_ALLOW_INSECURE: "true"
    ports: !override
      - "127.0.0.1:8080:8080"
    volumes: !reset []
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "/api", "healthcheck"]
      start_period: 20s

  mongo:
    ports: !reset []

  redis:
    ports: !reset []

  mailpit:
    # Only the UI is published; SMTP stays on the compose network.
    ports: !override
      - "127.0.0.1:8025:8025"
