openapi: 3.1.0
info:
  title: Monthra API
  version: 0.9.0
  description: |
    Personal finance API: expenses, income, investments and Open Finance connections.

    Errors use problem details (RFC 9457, `application/problem+json`). `title` and `detail`
    are translated (pt-BR, es-ES, en-US) from `Accept-Language` or, on authenticated routes,
    from the caller's stored locale (`PATCH /api/v1/me/preferences`); `Content-Language` says
    which. `code` is stable and machine-readable.

    ## Browser clients (CORS and CSRF)

    - Only the origins in `CORS_ALLOWED_ORIGINS` may call the API from a browser, with
      credentials. The web app and the API must be on the same site, because the auth
      cookies are `SameSite=Strict`.
    - Every mutating request (`POST`, `PUT`, `PATCH`, `DELETE`) sent by a browser (it has an
      `Origin` header or carries auth cookies) must send the token from
      `GET /api/v1/auth/csrf` in `X-CSRF-Token`, and the CSRF cookie set by that call.
      Fetch it once at startup and again after a `csrf_invalid` answer.
    - A request from a foreign `Origin` is rejected with `origin_not_allowed`.
    - Native clients (mobile) send `Authorization: Bearer` and no cookies, and need no
      CSRF token. Sending a Bearer token together with an auth cookie is rejected with
      `ambiguous_credentials`.

    ## Authentication

    - Sign up with `POST /api/v1/auth/register`. The answer is always `202`, whether or not
      the address is taken. A verification link reaches the inbox:
      `{APP_PUBLIC_URL}/verify-email#token=…`. The token is in the URL fragment, so it never
      reaches a server log. The app reads it and calls `POST /api/v1/auth/verify-email`.
      Links last 30 minutes and work once.
    - `POST /api/v1/auth/login` needs a verified email. Wrong addresses and wrong passwords
      get the same `invalid_credentials` answer. After repeated failures the address (or IP)
      is locked for 1 minute, doubling up to 15 (`429 rate_limited` with `Retry-After`). When
      a captcha is enabled, `captcha_required` asks for a Cloudflare Turnstile token in
      `captchaToken`.
    - Access tokens are EdDSA JWTs valid for 15 minutes. Refresh tokens are opaque, last
      30 days and **rotate on every use**:
      - A refresh token presented again within 10 seconds of its rotation answers
        `409 refresh_conflict`. Retry the original request: another request (tab) already
        holds the new tokens.
      - Presented later, it counts as stolen. The whole session is revoked and every token
        of it stops working (`401`).
      - Clients must refresh in **single flight**: one refresh at a time, with every waiting
        request reusing its result.
    - `POST /api/v1/auth/logout` needs a valid access token. With an expired one, refresh first.
    - **Password recovery:** `POST /api/v1/auth/forgot-password` always answers `202`, and an
      address with an account gets a link to `{APP_PUBLIC_URL}/reset-password#token=…` (15
      minutes, single use; a new request voids the earlier links). `POST
      /api/v1/auth/reset-password` sets the new password, confirms the address and **signs out
      every session**. Two-step verification stays on.
    - One address receives at most 5 account emails (verification, sign-up attempt, reset) per
      hour; more answers `429` before the address is even looked up.
    - **Two-step verification (TOTP):**
      - Turn it on with `POST /api/v1/auth/mfa/setup` (asks for the password again; returns the
        secret and an `otpauth://` URI for a QR code, valid 15 minutes), then
        `POST /api/v1/auth/mfa/enable` with a code from the authenticator app. The answer holds
        10 recovery codes, **shown only once**.
      - With it on, a correct password answers `200 {"mfaRequired": true, "mfaToken": "…",
        "expiresIn": 300}` and no session. Send `POST /api/v1/auth/mfa/verify` with the
        `mfaToken` and a 6-digit code or a recovery code to get the session (cookies or tokens,
        as for a login). A `mfaToken` takes 5 codes; then sign in again (`mfa_challenge_invalid`).
      - Each code works once: wait for the next one rather than reusing it. Wrong codes count
        toward the lockout of the address, like wrong passwords.
      - `POST /api/v1/auth/mfa/disable` takes the password and a code.
      - A wrong password or code on these routes answers `403` (`password_incorrect`,
        `mfa_code_invalid`), never `401`: the session is still valid.
    - **Browsers** (requests with an `Origin` header) get the tokens only as `HttpOnly`,
      `SameSite=Strict` cookies, never in the body:
      - The access token goes in `__Host-monthra_at`, on `Path=/`.
      - The refresh token goes in `__Secure-monthra_rt`, on `Path=/api/v1/auth/refresh`, so it
        reaches no other route. `__Host-` requires `Path=/`, hence the `__Secure-` prefix.
        Locally, without TLS, the cookies have no prefix.
    - **Native clients** get the tokens in the JSON body. They keep them in secure storage and
      send `Authorization: Bearer <access token>` and `{"refreshToken": "…"}` to the refresh route.
    - Request bodies must be `application/json`. Unknown fields are rejected.

    ## Account (`/api/v1/me`)

    Every route acts on the caller of the access token; none takes a user id.
    - `GET`/`PATCH /me` read the profile and change the display name. `GET`/`PATCH
      /me/preferences` read and change the locale, theme and currency; a new locale applies to
      the next answers on every device and to the account emails.
    - `POST /me/password` asks for the current password, signs out **every other** session and
      voids pending reset links. The caller's session stays.
    - `GET /me/sessions` lists the active sessions (up to 100, the most recently used first).
      `DELETE /me/sessions/{id}` signs one out (another user's session answers `404`, like an
      unknown one) and `DELETE /me/sessions` signs out all but the current one.
    - `DELETE /me` erases the account and its data (LGPD). It takes the password and, with
      two-step verification on, a code. Every session stops working at once. The security
      audit trail is kept for its retention period; the address can sign up again.
    - Wrong passwords and codes here answer `403` (`password_incorrect`, `mfa_code_invalid`) and
      count toward the lockout of the address.

    ## Money

    - Every amount is an **integer in minor units** (cents) of its currency:
      `"initialBalance": 150000` is R$ 1,500.00. Never a float, never a decimal string.
      Amounts are bounded by 10^13 in absolute value, so totals stay exact in clients that
      hold numbers as doubles (JavaScript, Dart on the web).
    - Each account has its own currency (`BRL`, `USD` or `EUR`), fixed when it is created.
      Totals are grouped by currency; nothing is converted.

    ## Accounts (`/api/v1/accounts`)

    - Accounts are `checking`, `savings`, `credit_card`, `cash` or `brokerage`. A credit card
      needs `card` (closing day, due day, optional limit); the other types refuse it.
    - `type` and `currency` never change (they are not fields of the `PATCH`): create another
      account instead.
    - `PATCH` with `"archived": true` hides an account from `GET /accounts`; it comes back with
      `?includeArchived=true` and with `"archived": false`. An archived account keeps its history.
    - One user holds at most 100 accounts, archived ones included (`409 limit_reached`).
    - Every account answers `balance` (the initial balance plus the transactions up to
      `?asOf=YYYY-MM-DD`, the client's local today; today in UTC when absent) and
      `projectedBalance` (plus every transaction, future ones included).
    - An account with transactions (as their account or as the destination of a transfer)
      cannot be deleted (`409 account_in_use`): archive it instead.
    - Every route acts on the caller's accounts only: another user's account answers `404`,
      exactly like one that does not exist.

    ## Categories (`/api/v1/categories`)

    - A category is `expense` or `income`, fixed when it is created, with a Lucide icon name in
      kebab-case (`shopping-cart`) and a `#RRGGBB` color (answered in upper case).
    - Every user starts with 22 default categories, created on their first `GET` or `POST`.
      A default carries its `defaultKey` (`groceries`, `salary`, ...) and is named in the
      caller's language (the stored preference) until renamed; a renamed default keeps its
      key and its new name in every language. A deleted default does not come back.
    - One user holds at most 200 categories, the defaults included (`409 limit_reached`).
    - A category with transactions cannot be deleted (`409 category_in_use`) unless
      `?reassignTo=` names another category of the same kind, which takes its transactions.
    - Every route acts on the caller's categories only: another user's category answers `404`.

    ## Transactions (`/api/v1/transactions`)

    - A transaction is an `expense`, an `income` or a `transfer` between two of the caller's
      accounts. `kind` is fixed when it is created.
    - `amount` is always positive, in minor units of the account's currency (`currency` in
      the answer); the kind gives the direction.
    - Expenses and income need a `categoryId` of the same kind (`kind_mismatch` otherwise);
      transfers have none.
    - A transfer names `toAccountId`. Between accounts of one currency the amount received
      (`toAmount`) equals `amount` and may be left out; between two currencies `toAmount` is
      required (what arrived, in the destination's currency). Nothing is converted.
    - `date` is a civil day (`"2026-11-30"`, from 1900 to 2100), with no time and no zone, so
      a transaction stays in its month wherever the user is. Future days are allowed.
    - An archived account takes no new transactions (`archived` on the field); its existing
      ones can still be changed.
    - `GET /transactions` answers pages, newest day first, with `nextCursor` (opaque, null on
      the last page) to pass back as `?cursor=`. Filters: `from`/`to` (days, both included),
      `accountId` (its transactions and the transfers it received), `categoryId`, `kind`,
      `tag`, `q` (text in the description, ignoring case and accents), `invoice` (with
      `accountId`: the transactions of one invoice of that card) and `installmentGroupId`
      (the installments of one purchase).
    - Every route acts on the caller's transactions only: another user's transaction, or an
      id of another user's account or category in the body, reads like one that does not
      exist (`404`, or `invalid` on the field).

    ## Installments

    - An expense on any account may be split into 2 to 48 monthly installments:
      `installments` on `POST /transactions`, with `amount` the total. Each installment is a
      transaction of its own, with `installment: {groupId, number, count}`; the answer is
      the first one, and `?installmentGroupId=` lists them all.
    - Installment *i* takes `amount / count`, the first one the remainder too. It falls on
      the day of the purchase *i*-1 months later (the last day of a shorter month: a purchase
      on January 31 falls on February 28, then March 31). On a credit card it belongs to the
      first one's invoice plus *i*-1 (`invoiceMonth` names the first invoice).
    - `PATCH` and `DELETE` take `?scope=this|future|all` (`this` by default): the installment
      addressed, it and the ones numbered after it, or the whole purchase. A scope on a
      transaction outside a purchase reaches that transaction alone.
    - A scoped `PATCH` gives the other installments the changes it makes to the one
      addressed: `amount` (of each installment), `categoryId`, `description`, `tags` and
      `accountId` take its new value; a new `date` moves each one by the same months, on the
      new day; when the day, the account or the invoice changes, installment *j* takes the
      addressed one's invoice plus *j*-*k*. A field sent with the value it already has changes
      nothing, so a client may send its whole form. The answer is the installment addressed.
    - A purchase stays on one account: changing `accountId` of an installment needs
      `scope=all` (`scope: invalid` otherwise).
    - Deleting installments leaves the others numbered as they were (`1/12`); the number of
      installments never changes (delete the purchase and create it again).

    ## Credit card invoices (`/api/v1/accounts/{id}/invoices`)

    - An invoice is named after the month it falls due in (`"2026-12"` falls due on the
      card's `dueDay` of December). It closes on `closingDay` of that month when `dueDay` comes
      later, of the month before otherwise; a day past the end of a shorter month is its last
      day.
    - A transaction on a card belongs to an invoice (`invoiceMonth`): an expense or a transfer
      out of the card is a charge, an income on it (a refund) a credit. A purchase belongs to
      the first invoice that closes after its day, so one on the closing day goes to the next
      invoice.
    - Paying an invoice is a `transfer` to the card; `toInvoiceMonth` is the invoice it pays,
      by default the last one closed on the payment's day.
    - The invoice is stored with the transaction when it is written, so changing the card's
      days later moves no transaction. A transaction may name another invoice
      (`invoiceMonth`/`toInvoiceMonth`, within 12 months of the one its day picks): a purchase
      the bank posted late, a payment made early. A change of day or account picks the invoice
      again unless the change names one; an empty one picks it from the day again.
    - What an invoice leaves unpaid rolls into the next one as `previousBalance`, the card's
      opening debt (a negative `initialBalance`) included. There is no interest and no minimum
      payment. A negative balance is a credit.
    - `status` on `?asOf=` (the client's local today): `upcoming` (its cycle has not begun),
      `open`, `closed` (waiting for its payment), `paid`, `overdue` (past its due day with
      something left) or `carried_over` (the next invoice closed with what it left).
    - Closing and due days come from the card's current settings.

    ## Rate limits

    Every `/api/v1` response carries `RateLimit-Limit`, `RateLimit-Remaining` and
    `RateLimit-Reset` (seconds). A spent budget answers `429` (`rate_limited`) with
    `Retry-After` (seconds).
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080
    description: Local
# Public by default; authenticated operations declare their own security.
security: []
tags:
  - name: health
    description: Liveness and readiness probes
  - name: auth
    description: Authentication and browser session protection
  - name: me
    description: The caller's own account, preferences, password and sessions
  - name: accounts
    description: The caller's money accounts (bank, savings, credit card, cash, brokerage)
  - name: categories
    description: The caller's expense and income categories
  - name: transactions
    description: The caller's expenses, income and transfers
  - name: invoices
    description: The invoices of the caller's credit cards
paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness probe
      description: Reports that the process is up. Never checks dependencies.
      operationId: getHealthz
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /readyz:
    get:
      tags: [health]
      summary: Readiness probe
      description: Checks MongoDB and Redis within 2 seconds.
      operationId: getReadyz
      responses:
        "200":
          description: Every dependency answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/csrf:
    get:
      tags: [auth]
      summary: CSRF token
      description: |
        Sets the readable CSRF cookie (`__Host-monthra_csrf` behind TLS, `monthra_csrf`
        locally; `SameSite=Strict`, not `HttpOnly`) and returns the same token. A request
        that already carries a valid token gets that token back, so open tabs keep theirs.
      operationId: getCsrfToken
      responses:
        "200":
          description: The token to send in `X-CSRF-Token`.
          headers:
            RateLimit-Limit:
              $ref: "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              $ref: "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              $ref: "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsrfToken"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Sign up
      description: |
        Creates an unverified account and emails a verification link. Always `202` for valid
        input. If the address is taken, its owner gets a "someone tried to sign up" email
        instead, and the existing account is untouched. The password must have 10 to 1024
        characters and must not appear in known breaches (`breached`).
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Accepted; check the inbox.
        "403":
          $ref: "#/components/responses/AuthForbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/verify-email:
    post:
      tags: [auth]
      summary: Confirm an email address
      operationId: verifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "204":
          description: The address is confirmed.
        "400":
          $ref: "#/components/responses/TokenInvalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/auth/verify-email/resend:
    post:
      tags: [auth]
      summary: Send a new verification link
      description: |
        Always `202` for a well-formed address. Only an unverified account gets a new link,
        and the earlier links stop working.
      operationId: resendVerification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password
      description: |
        Opens a session, or, when two-step verification is on, answers an `MFAChallenge`
        (no cookies, no tokens) to complete with `POST /api/v1/auth/mfa/verify`.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: |
            Signed in (`Session`, with cookies for browsers), or the second factor is required
            (`MFAChallenge`).
          headers:
            Set-Cookie:
              description: Browsers only, and only with a `Session`.
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Session"
                  - $ref: "#/components/schemas/MFAChallenge"
        "401":
          description: Wrong email or password (`invalid_credentials`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/AuthForbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/forgot-password:
    post:
      tags: [auth]
      summary: Ask for a password reset link
      description: |
        Always `202` for a well-formed address. An address with an account (verified or not)
        gets a single-use link valid for 15 minutes; the earlier links stop working.
      operationId: forgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "202":
          description: Accepted; check the inbox.
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/reset-password:
    post:
      tags: [auth]
      summary: Set a new password with a reset link
      description: |
        Sets the password, confirms the address, revokes every session (browsers also get
        their auth cookies cleared) and emails a notice. A password refused by the policy
        (`422`) leaves the link usable.
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: The password changed; sign in again.
        "400":
          $ref: "#/components/responses/TokenInvalid"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/mfa/verify:
    post:
      tags: [auth]
      summary: Complete a login with a TOTP or recovery code
      operationId: verifyMfa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAVerifyRequest"
      responses:
        "200":
          $ref: "#/components/responses/Session"
        "401":
          description: |
            The `mfaToken` is unknown, expired, used or out of attempts
            (`mfa_challenge_invalid`): sign in again.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/MFAForbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/mfa/setup:
    post:
      tags: [auth]
      summary: Start turning two-step verification on
      description: |
        Asks for the password again and returns a new TOTP secret (SHA-1, 6 digits, 30
        seconds) for the authenticator app. Nothing changes until `/auth/mfa/enable` confirms
        it, within 15 minutes. A new setup replaces an unfinished one.
      operationId: setupMfa
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFASetupRequest"
      responses:
        "200":
          description: The secret, never stored in clear text.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFASetup"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MFAForbidden"
        "409":
          $ref: "#/components/responses/MFAConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/mfa/enable:
    post:
      tags: [auth]
      summary: Confirm the setup and turn two-step verification on
      operationId: enableMfa
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAEnableRequest"
      responses:
        "200":
          description: On. The recovery codes are shown only this once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodes"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MFAForbidden"
        "409":
          $ref: "#/components/responses/MFAConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/mfa/disable:
    post:
      tags: [auth]
      summary: Turn two-step verification off
      description: Takes the password and a current TOTP or recovery code.
      operationId: disableMfa
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFADisableRequest"
      responses:
        "204":
          description: Off; the secret and the recovery codes are deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/MFAForbidden"
        "409":
          $ref: "#/components/responses/MFAConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token
      description: |
        Browsers send no body; the `__Secure-monthra_rt` cookie carries the token. Native
        clients send it in the body. Refresh in single flight (see the API description).
      operationId: refresh
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          $ref: "#/components/responses/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: |
            The token was rotated moments ago by a concurrent request (`refresh_conflict`).
            Retry the original request with the credentials that request received.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Sign out
      description: Ends the session, denylists the access token and clears the auth cookies.
      operationId: logout
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: Signed out.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/me:
    get:
      tags: [me]
      summary: Read the caller's profile
      operationId: getMe
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: "The profile (`Cache-Control: no-store`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [me]
      summary: Change the display name
      description: Only `name` can change here; any other field is rejected (`bad_request`).
      operationId: updateMe
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          description: Malformed body or unknown field (`bad_request`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [me]
      summary: Delete the account and its data (LGPD)
      description: |
        Takes the password and, with two-step verification on, a TOTP or recovery code. Every
        session is signed out first, then the data of each feature is erased and the account
        last; a failure leaves the account in place, so the request can be sent again. The
        security audit trail (without the address) is kept for its retention period, and the
        owner gets a confirmation email. Browsers get their auth cookies cleared.
      operationId: deleteMe
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountRequest"
      responses:
        "204":
          description: Deleted.
        "403":
          $ref: "#/components/responses/MFAForbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/me/preferences:
    get:
      tags: [me]
      summary: Read the preferences
      operationId: getPreferences
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: The preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [me]
      summary: Change some preferences
      description: |
        Absent or `null` fields stay as they are. One unsupported value rejects the whole
        change (`422`, the field with code `invalid`). A new locale applies to the next answers
        on every device and to the account emails.
      operationId: updatePreferences
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreferencesPatch"
      responses:
        "200":
          description: The resulting preferences.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preferences"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/me/password:
    post:
      tags: [me]
      summary: Change the password
      description: |
        Asks for the current password, applies the password policy and the breach check, signs
        out every other session, voids pending reset links and emails a notice. The caller's
        session stays.
      operationId: changePassword
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Changed.
        "403":
          $ref: "#/components/responses/MFAForbidden"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/me/sessions:
    get:
      tags: [me]
      summary: List the active sessions
      description: |
        Up to 100, the most recently used first. `lastUsedAt` moves on each refresh, so it is
        accurate to the access token lifetime (15 minutes).
      operationId: listSessions
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: "The sessions (`Cache-Control: no-store`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [me]
      summary: Sign out every other session
      operationId: revokeOtherSessions
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: Every session but the current one is signed out.
        "403":
          $ref: "#/components/responses/Forbidden"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/me/sessions/{id}:
    delete:
      tags: [me]
      summary: Sign out one session
      description: |
        Signing out the current session clears a browser's auth cookies. Repeating the request
        for an already signed-out session answers `204` again.
      operationId: revokeSession
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Signed out.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not one of the caller's sessions, or expired (`not_found`).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/accounts:
    get:
      tags: [accounts]
      summary: List the accounts
      description: Oldest first. Archived accounts only with `includeArchived=true`.
      operationId: listAccounts
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200":
          description: "The accounts, every one of them (at most 100; `Cache-Control: no-store`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [accounts]
      summary: Create an account
      description: A new account's `balance` and `projectedBalance` are its initial balance.
      operationId: createAccount
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreate"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: The path of the new account.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/LimitReached"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/accounts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [accounts]
      summary: Read an account
      operationId: getAccount
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/AsOf"
      responses:
        "200":
          description: "The account (`Cache-Control: no-store`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [accounts]
      summary: Change an account
      description: |
        Absent fields stay as they are; `card` replaces the whole settings (an absent `limit`
        removes the limit). `type`, `currency` and `source` are not fields: sending them answers
        `400`. A change that changes nothing answers the account as it is.
      operationId: updateAccount
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/AsOf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPatch"
      responses:
        "200":
          description: The account after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [accounts]
      summary: Delete an account
      description: |
        Deletes an account without transactions for good. An account with transactions (as
        their account or as the destination of a transfer) answers `409 account_in_use`:
        archive it to keep its history.
      operationId: deleteAccount
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "204":
          description: Deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/AccountInUse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/accounts/{id}/invoices:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [invoices]
      summary: List the invoices of a credit card
      description: |
        One invoice per month from `from` to `to` (both included, at most 24), the months
        without transactions included. A missing bound takes the other one; with neither, the
        invoice open on `asOf`. An account that is not a credit card has no invoices and
        answers `404`, like another user's account.
      operationId: listInvoices
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Month"
        - name: to
          in: query
          required: false
          description: "Not before `from` (`to: invalid`), at most 23 months after it (`to: out_of_range`)."
          schema:
            $ref: "#/components/schemas/Month"
        - name: asOf
          in: query
          required: false
          description: The day the statuses (and the default invoice) are read on, the client's local today; today in UTC when absent.
          schema:
            $ref: "#/components/schemas/Date"
      responses:
        "200":
          description: "The invoices, oldest first (`Cache-Control: no-store`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceList"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/categories:
    get:
      tags: [categories]
      summary: List the categories
      description: |
        Oldest first, so the defaults come in their curated order (expenses, then income) and
        new categories after them. The first call of a user creates the default categories.
      operationId: listCategories
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [expense, income]
      responses:
        "200":
          description: "The categories, every one of them (at most 200; `Cache-Control: no-store`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [categories]
      summary: Create a category
      description: The default categories are created first, and count toward the limit of 200.
      operationId: createCategory
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: The path of the new category.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/LimitReached"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [categories]
      summary: Read a category
      operationId: getCategory
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: "The category (`Cache-Control: no-store`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [categories]
      summary: Change a category
      description: |
        Absent fields stay as they are. Naming a default category fixes its name in every
        language. `kind` and `defaultKey` are not fields: sending them answers `400`. A change
        that changes nothing answers the category as it is.
      operationId: updateCategory
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatch"
      responses:
        "200":
          description: The category after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [categories]
      summary: Delete a category
      description: |
        Deletes the category for good. A deleted default is not created again. A category with
        transactions answers `409 category_in_use`, unless `reassignTo` names another of the
        caller's categories of the same kind: its transactions move there first
        (`reassignTo: invalid` for an unknown or the same category, `kind_mismatch` for the
        other kind).
      operationId: deleteCategory
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: reassignTo
          in: query
          required: false
          description: The category that takes the transactions of the deleted one.
          schema:
            type: string
      responses:
        "204":
          description: Deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/CategoryInUse"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/transactions:
    get:
      tags: [transactions]
      summary: List the transactions
      description: |
        One page, newest day first (ties broken by the newest record). Pass `nextCursor` back
        as `cursor` for the next page; keep the same filters. Empty parameters are ignored.
      operationId: listTransactions
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - name: from
          in: query
          required: false
          description: First day included.
          schema:
            $ref: "#/components/schemas/Date"
        - name: to
          in: query
          required: false
          description: "Last day included; not before `from` (`to: invalid`)."
          schema:
            $ref: "#/components/schemas/Date"
        - name: accountId
          in: query
          required: false
          description: The account's transactions and the transfers it received.
          schema:
            type: string
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
        - name: kind
          in: query
          required: false
          schema:
            type: string
            enum: [expense, income, transfer]
        - name: tag
          in: query
          required: false
          description: One tag, matched ignoring case.
          schema:
            type: string
            maxLength: 30
        - name: q
          in: query
          required: false
          description: Text the description contains, ignoring case and accents (`cafe` finds `Café`).
          schema:
            type: string
            maxLength: 100
        - name: invoice
          in: query
          required: false
          description: |
            One invoice of the card `accountId` (required with it: `accountId: required`): its
            charges, credits and the payments to it.
          schema:
            $ref: "#/components/schemas/Month"
        - name: installmentGroupId
          in: query
          required: false
          description: The installments of one purchase (`installment.groupId`).
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page.
          schema:
            type: string
      responses:
        "200":
          description: "One page (`Cache-Control: no-store`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    post:
      tags: [transactions]
      summary: Create a transaction
      description: |
        The accounts and the category are looked up among the caller's records only: another
        user's id is `invalid`, like one that does not exist. An archived account is
        `archived`. With `installments`, it creates the installments of the purchase and
        answers the first one.
      operationId: createTransaction
      security:
        - bearerAuth: []
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionCreate"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: The path of the new transaction (the first installment of a purchase).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "403":
          $ref: "#/components/responses/Forbidden"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/transactions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [transactions]
      summary: Read a transaction
      operationId: getTransaction
      security:
        - bearerAuth: []
        - cookieAuth: []
      responses:
        "200":
          description: "The transaction (`Cache-Control: no-store`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    patch:
      tags: [transactions]
      summary: Change a transaction
      description: |
        Absent (or null) fields stay as they are; an empty `description` or `tags` clears
        them, and `tags` replaces the whole list. `kind`, `currency` and `source` are not
        fields: sending them answers `400`. Only an account the change moves the transaction
        to must be active, so a transaction of an archived account can still be corrected.
        Between accounts of one currency `toAmount` follows `amount`; a change that makes a
        transfer cross currencies needs `toAmount`. A change that changes nothing answers the
        transaction as it is. On an installment, `scope` reaches the other installments of
        the purchase (see Installments).
      operationId: updateTransaction
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EditScope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionPatch"
      responses:
        "200":
          description: The transaction after the change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [transactions]
      summary: Delete a transaction
      description: |
        Deletes the transaction for good; on an installment, `scope` reaches the others of
        the purchase, and the ones left keep their numbers.
      operationId: deleteTransaction
      security:
        - bearerAuth: []
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/EditScope"
      responses:
        "204":
          description: Deleted.
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
components:
  parameters:
    AsOf:
      name: asOf
      in: query
      required: false
      description: |
        The day `balance` counts transactions up to: the client's local today. Today in UTC
        when absent.
      schema:
        $ref: "#/components/schemas/Date"
    EditScope:
      name: scope
      in: query
      required: false
      description: |
        How far the change reaches on an installment: `this` one, it and the `future` ones
        (numbered after it), or `all` of the purchase. Outside a purchase, the transaction
        alone. An unknown value answers `422` (`scope: invalid`).
      schema:
        type: string
        enum: [this, future, all]
        default: this
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Native clients. Never sent together with the access cookie.
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-monthra_at
      description: Browsers (`monthra_at` locally). Mutating requests also need `X-CSRF-Token`.
  headers:
    X-Request-ID:
      description: Request id, echoed from a well-formed incoming header or generated.
      schema:
        type: string
    RateLimit-Limit:
      description: Requests allowed in the budget's window.
      schema:
        type: integer
    RateLimit-Remaining:
      description: Requests left in the budget.
      schema:
        type: integer
    RateLimit-Reset:
      description: Seconds until the budget is full again.
      schema:
        type: integer
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
  responses:
    Session:
      description: |
        Signed in. Browsers get `__Host-monthra_at` and `__Secure-monthra_rt` cookies and only
        the lifetimes in the body; native clients get the tokens too.
      headers:
        Set-Cookie:
          description: Browsers only. The access and refresh cookies (`HttpOnly`, `SameSite=Strict`).
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Session"
    Unauthorized:
      description: Missing, invalid, expired or revoked credentials (`unauthorized`, `ambiguous_credentials`).
      headers:
        WWW-Authenticate:
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AuthForbidden:
      description: |
        `email_not_verified` (login with the right password on an unconfirmed account),
        `captcha_required`, `captcha_invalid`, or a CSRF guard rejection.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MFAForbidden:
      description: |
        The password asked again is wrong (`password_incorrect`), the code is wrong or was
        already used (`mfa_code_invalid`), or a CSRF guard rejection. The session stays valid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MFAConflict:
      description: |
        `mfa_already_enabled` (setup or enable while on), `mfa_not_enabled` (disable while
        off) or `mfa_setup_required` (no setup to confirm, or it expired).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TokenInvalid:
      description: The link is unknown, used or expired (`token_invalid`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The body is not `application/json` (`unsupported_media_type`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: |
        Invalid fields (`validation_failed`), listed in `errors` with codes `required`,
        `invalid`, `too_short`, `too_long`, `out_of_range` (an amount or a day outside its
        bounds), `breached`, `archived` (an archived account takes no new transactions) or
        `kind_mismatch` (a category of the other kind). Nested fields are dotted
        (`card.closingDay`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: |
        Not one of the caller's records (`not_found`): another user's record answers exactly
        like one that does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    LimitReached:
      description: The caller already holds the maximum number of these records (`limit_reached`).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AccountInUse:
      description: The account has transactions (`account_in_use`); archive it instead.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CategoryInUse:
      description: The category has transactions (`category_in_use`); pass `reassignTo` to move them.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        Rejected by the CSRF guard: `origin_not_allowed`, `csrf_invalid` or
        `ambiguous_credentials`.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: The rate limit budget is spent (`rate_limited`).
      headers:
        Retry-After:
          $ref: "#/components/headers/Retry-After"
        RateLimit-Limit:
          $ref: "#/components/headers/RateLimit-Limit"
        RateLimit-Remaining:
          $ref: "#/components/headers/RateLimit-Remaining"
        RateLimit-Reset:
          $ref: "#/components/headers/RateLimit-Reset"
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: A dependency is unavailable.
      headers:
        X-Request-ID:
          $ref: "#/components/headers/X-Request-ID"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [name, email, password]
      properties:
        name:
          type: string
          description: Display name, 1 to 100 characters.
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 1024
          format: password
        captchaToken:
          type: string
          description: Turnstile token, when `captcha_required` asked for one.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        captchaToken:
          type: string
    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          description: The token from the link fragment.
    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token:
          type: string
          description: The token from the link fragment.
        password:
          type: string
          minLength: 10
          maxLength: 1024
          format: password
    MFAChallenge:
      type: object
      required: [mfaRequired, mfaToken, expiresIn]
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaToken:
          type: string
          description: Send it to `/auth/mfa/verify` with a code. Single use.
        expiresIn:
          type: integer
          description: Seconds left to answer (300).
    MFAVerifyRequest:
      type: object
      additionalProperties: false
      required: [mfaToken, code]
      properties:
        mfaToken:
          type: string
        code:
          type: string
          description: A 6-digit TOTP code, or a recovery code (hyphens, spaces and case are ignored).
          examples: ["123456", "abcd-efgh-ijkl-mnop"]
    MFASetupRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
    MFASetup:
      type: object
      required: [secret, otpauthUri, expiresIn]
      properties:
        secret:
          type: string
          description: Base32 secret, for typing into the app by hand.
        otpauthUri:
          type: string
          description: "`otpauth://totp/...` URI, to show as a QR code."
        expiresIn:
          type: integer
          description: Seconds left to confirm the setup.
    MFAEnableRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          description: The current 6-digit code from the app.
    RecoveryCodes:
      type: object
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            examples: ["abcd-efgh-ijkl-mnop"]
    MFADisableRequest:
      type: object
      additionalProperties: false
      required: [password, code]
      properties:
        password:
          type: string
          format: password
        code:
          type: string
          description: A TOTP code or a recovery code.
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    Session:
      type: object
      required: [expiresIn, refreshExpiresIn]
      properties:
        tokenType:
          type: string
          enum: [Bearer]
          description: Native clients only.
        accessToken:
          type: string
          description: Native clients only.
        refreshToken:
          type: string
          description: Native clients only.
        expiresIn:
          type: integer
          description: Seconds until the access token expires.
        refreshExpiresIn:
          type: integer
          description: Seconds until the refresh token expires.
    Me:
      type: object
      required: [id, name, email, emailVerified, mfa, preferences, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        mfa:
          type: object
          required: [enabled, recoveryCodesRemaining]
          properties:
            enabled:
              type: boolean
            recoveryCodesRemaining:
              type: integer
              description: Unused recovery codes (0 while two-step verification is off).
        preferences:
          $ref: "#/components/schemas/Preferences"
        createdAt:
          type: string
          format: date-time
    UpdateMeRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    Preferences:
      type: object
      required: [locale, theme, currency]
      properties:
        locale:
          type: string
          enum: [pt-BR, es-ES, en-US]
        theme:
          type: string
          enum: [system, light, dark]
        currency:
          type: string
          enum: [BRL, USD, EUR]
    PreferencesPatch:
      type: object
      additionalProperties: false
      properties:
        locale:
          type: [string, "null"]
          enum: [pt-BR, es-ES, en-US, null]
        theme:
          type: [string, "null"]
          enum: [system, light, dark, null]
        currency:
          type: [string, "null"]
          enum: [BRL, USD, EUR, null]
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 10
          maxLength: 1024
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
        code:
          type: string
          description: A TOTP or recovery code; required when two-step verification is on.
    SessionList:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          maxItems: 100
          items:
            type: object
            required: [id, createdAt, lastUsedAt, expiresAt, userAgent, ip, current]
            properties:
              id:
                type: string
              createdAt:
                type: string
                format: date-time
              lastUsedAt:
                type: string
                format: date-time
              expiresAt:
                type: string
                format: date-time
              userAgent:
                type: string
                description: As sent at sign-in, cut to 256 bytes.
              ip:
                type: string
              current:
                type: boolean
                description: The session of this request.
    CardSettings:
      type: object
      additionalProperties: false
      required: [closingDay, dueDay]
      properties:
        closingDay:
          type: integer
          minimum: 1
          maximum: 31
          description: Day of the month the statement closes; in a shorter month, its last day.
        dueDay:
          type: integer
          minimum: 1
          maximum: 31
          description: Day of the month the statement falls due; in a shorter month, its last day.
        limit:
          type: [integer, "null"]
          format: int64
          minimum: 0
          maximum: 10000000000000
          description: Credit limit in minor units, when set.
    AccountCreate:
      type: object
      additionalProperties: false
      required: [name, type, currency]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          enum: [checking, savings, credit_card, cash, brokerage]
        currency:
          type: string
          enum: [BRL, USD, EUR]
          description: Fixed for the life of the account. Clients usually suggest the preferred currency.
        initialBalance:
          type: integer
          format: int64
          default: 0
          minimum: -10000000000000
          maximum: 10000000000000
          description: Balance before any transaction, in minor units. Negative for an overdraft or a card's debt.
        card:
          description: Required for `credit_card`, refused for every other type.
          oneOf:
            - $ref: "#/components/schemas/CardSettings"
            - type: "null"
    AccountPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        initialBalance:
          type: integer
          format: int64
          minimum: -10000000000000
          maximum: 10000000000000
        card:
          description: Credit cards only. Replaces the whole settings.
          $ref: "#/components/schemas/CardSettings"
        archived:
          type: boolean
    Account:
      type: object
      required: [id, name, type, currency, initialBalance, balance, projectedBalance, card, source, archived, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [checking, savings, credit_card, cash, brokerage]
        currency:
          type: string
          enum: [BRL, USD, EUR]
        initialBalance:
          type: integer
          format: int64
          description: In minor units of `currency`.
        balance:
          type: integer
          format: int64
          description: The initial balance plus the transactions up to `asOf`, in minor units.
        projectedBalance:
          type: integer
          format: int64
          description: The initial balance plus every transaction, future ones included.
        card:
          oneOf:
            - $ref: "#/components/schemas/CardSettings"
            - type: "null"
        source:
          type: string
          enum: [manual, open_finance]
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AccountList:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
    CategoryIcon:
      type: string
      maxLength: 64
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      description: A Lucide icon name in kebab-case. Clients show a generic icon for a name they do not know.
      examples: [shopping-cart]
    CategoryColor:
      type: string
      pattern: "^#[0-9A-Fa-f]{6}$"
      description: "`#RRGGBB`; answered in upper case."
      examples: ["#1E6B52"]
    CategoryCreate:
      type: object
      additionalProperties: false
      required: [name, kind, icon, color]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        kind:
          type: string
          enum: [expense, income]
          description: Fixed for the life of the category.
        icon:
          $ref: "#/components/schemas/CategoryIcon"
        color:
          $ref: "#/components/schemas/CategoryColor"
    CategoryPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        icon:
          $ref: "#/components/schemas/CategoryIcon"
        color:
          $ref: "#/components/schemas/CategoryColor"
    Category:
      type: object
      required: [id, name, kind, icon, color, defaultKey, createdAt, updatedAt]
      properties:
        id:
          type: string
        name:
          type: string
          description: The owner's name, or the default's name in the caller's language until renamed.
        kind:
          type: string
          enum: [expense, income]
        icon:
          $ref: "#/components/schemas/CategoryIcon"
        color:
          $ref: "#/components/schemas/CategoryColor"
        defaultKey:
          type: [string, "null"]
          description: The default category this one was created from, or null for the owner's own.
          enum:
            - housing
            - groceries
            - dining
            - transport
            - health
            - education
            - leisure
            - shopping
            - utilities
            - subscriptions
            - personal_care
            - pets
            - travel
            - taxes_fees
            - gifts_donations
            - other_expense
            - salary
            - side_income
            - investment_income
            - refunds
            - gifts_received
            - other_income
            - null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CategoryList:
      type: object
      required: [categories]
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    Date:
      type: string
      format: date
      description: A civil day, `YYYY-MM-DD`, from 1900-01-01 to 2100-12-31; no time, no zone.
      examples: ["2026-11-30"]
    Month:
      type: string
      pattern: "^[0-9]{4}-[0-9]{2}$"
      description: A civil month, `YYYY-MM`, from 1900-01 to 2100-12.
      examples: ["2026-12"]
    Amount:
      type: integer
      format: int64
      minimum: 1
      maximum: 10000000000000
      description: Positive, in minor units (cents) of the account's currency.
    Tags:
      type: array
      maxItems: 10
      items:
        type: string
        minLength: 1
        maxLength: 30
      description: Answered in lower case, without repeats, in the order given.
    TransactionCreate:
      type: object
      additionalProperties: false
      required: [kind, accountId, amount, date]
      properties:
        kind:
          type: string
          enum: [expense, income, transfer]
          description: Fixed for the life of the transaction.
        accountId:
          type: string
          description: Where an expense left or an income arrived; the source of a transfer.
        categoryId:
          type: string
          description: Required on expenses and income (a category of the same kind); refused on transfers.
        toAccountId:
          type: string
          description: Transfers only, and required there; another account than `accountId`.
        amount:
          $ref: "#/components/schemas/Amount"
        toAmount:
          type: [integer, "null"]
          format: int64
          minimum: 1
          maximum: 10000000000000
          description: |
            Transfers only: what arrived, in minor units of the destination's currency. Required
            between two currencies; between accounts of one currency it equals `amount`.
        date:
          $ref: "#/components/schemas/Date"
        invoiceMonth:
          allOf:
            - $ref: "#/components/schemas/Month"
          description: |
            A credit card `accountId` only (`invalid` otherwise): the invoice of the
            transaction, within 12 months of the one its day picks (`out_of_range`). Absent, the
            day picks it.
        toInvoiceMonth:
          allOf:
            - $ref: "#/components/schemas/Month"
          description: |
            A transfer to a credit card only: the invoice it pays, within 12 months of the
            default. Absent, the last invoice closed on its day.
        description:
          type: string
          maxLength: 200
        tags:
          $ref: "#/components/schemas/Tags"
        installments:
          type: integer
          minimum: 2
          maximum: 48
          description: |
            Expenses only (`invalid` otherwise): splits `amount`, the total, into that many
            monthly installments, at least one minor unit each (`out_of_range` otherwise).
    TransactionPatch:
      type: object
      additionalProperties: false
      properties:
        accountId:
          type: string
        categoryId:
          type: string
          description: Expenses and income only.
        toAccountId:
          type: string
          description: Transfers only.
        amount:
          $ref: "#/components/schemas/Amount"
        toAmount:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000000000000
          description: Transfers only.
        date:
          $ref: "#/components/schemas/Date"
          description: On a credit card, a new day picks the invoice again unless `invoiceMonth` is given.
        invoiceMonth:
          type: string
          description: A credit card leg only; an empty string picks the invoice from the day again.
        toInvoiceMonth:
          type: string
          description: A transfer to a credit card only; an empty string picks the default again.
        description:
          type: string
          maxLength: 200
          description: An empty string clears it.
        tags:
          $ref: "#/components/schemas/Tags"
    Transaction:
      type: object
      required: [id, kind, accountId, currency, categoryId, toAccountId, toCurrency, amount, toAmount, date, invoiceMonth, toInvoiceMonth, description, tags, installment, source, createdAt, updatedAt]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [expense, income, transfer]
        accountId:
          type: string
        currency:
          type: string
          enum: [BRL, USD, EUR]
          description: The currency of `accountId`, which `amount` is in.
        categoryId:
          type: [string, "null"]
          description: Null on transfers.
        toAccountId:
          type: [string, "null"]
          description: Null except on transfers.
        toCurrency:
          type: [string, "null"]
          enum: [BRL, USD, EUR, null]
        amount:
          $ref: "#/components/schemas/Amount"
        toAmount:
          type: [integer, "null"]
          format: int64
          description: What a transfer added to `toAccountId`, in minor units of `toCurrency`.
        date:
          $ref: "#/components/schemas/Date"
        invoiceMonth:
          type: [string, "null"]
          description: The invoice of a transaction on a credit card (`YYYY-MM`); null otherwise.
          examples: ["2026-12"]
        toInvoiceMonth:
          type: [string, "null"]
          description: The invoice a transfer to a credit card pays; null otherwise.
        description:
          type: string
        tags:
          type: array
          items:
            type: string
        installment:
          oneOf:
            - $ref: "#/components/schemas/Installment"
            - type: "null"
          description: Null outside an installment purchase.
        source:
          type: string
          enum: [manual, open_finance]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Installment:
      type: object
      required: [groupId, number, count]
      properties:
        groupId:
          type: string
          description: The same on every installment of a purchase.
        number:
          type: integer
          minimum: 1
          description: From 1; never renumbered.
        count:
          type: integer
          minimum: 2
          maximum: 48
    TransactionPage:
      type: object
      required: [transactions, nextCursor]
      properties:
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/Transaction"
        nextCursor:
          type: [string, "null"]
          description: Pass it as `cursor` for the next page; null on the last one.
    Invoice:
      type: object
      required: [month, closingDate, dueDate, status, currency, previousBalance, charges, credits, total, paid, remaining]
      description: Amounts in minor units of `currency`.
      properties:
        month:
          $ref: "#/components/schemas/Month"
        closingDate:
          $ref: "#/components/schemas/Date"
        dueDate:
          $ref: "#/components/schemas/Date"
        status:
          type: string
          enum: [upcoming, open, closed, paid, overdue, carried_over]
        currency:
          type: string
          enum: [BRL, USD, EUR]
        previousBalance:
          type: integer
          format: int64
          description: What the invoices before left unpaid, the opening debt included; negative is a credit.
        charges:
          type: integer
          format: int64
          description: Expenses and transfers out of the card.
        credits:
          type: integer
          format: int64
          description: Income on the card (refunds, cashback).
        total:
          type: integer
          format: int64
          description: "`previousBalance + charges - credits`."
        paid:
          type: integer
          format: int64
          description: What the payments to this invoice brought.
        remaining:
          type: integer
          format: int64
          description: "`total - paid`; it becomes the next invoice's `previousBalance`."
    InvoiceList:
      type: object
      required: [invoices]
      properties:
        invoices:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
    CsrfToken:
      type: object
      required: [csrfToken]
      properties:
        csrfToken:
          type: string
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
          examples: ["urn:monthra:problem:not_found"]
        title:
          type: string
          description: Translated summary.
        status:
          type: integer
        detail:
          type: string
          description: Translated explanation.
        instance:
          type: string
          description: Request path.
        code:
          type: string
          description: Stable machine-readable error code.
          enum:
            - bad_request
            - not_found
            - method_not_allowed
            - payload_too_large
            - internal_error
            - service_unavailable
            - rate_limited
            - origin_not_allowed
            - csrf_invalid
            - ambiguous_credentials
            - unsupported_media_type
            - validation_failed
            - unauthorized
            - invalid_credentials
            - email_not_verified
            - token_invalid
            - refresh_conflict
            - captcha_required
            - captcha_invalid
            - password_incorrect
            - mfa_code_invalid
            - mfa_challenge_invalid
            - mfa_already_enabled
            - mfa_not_enabled
            - mfa_setup_required
            - limit_reached
        requestId:
          type: string
        errors:
          type: array
          items:
            type: object
            required: [field, code]
            properties:
              field:
                type: string
              code:
                type: string
